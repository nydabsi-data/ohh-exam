<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ · Ohh-Exam</title>
  <meta name="description" content="ฝึกข้อสอบวันละไม่กี่นาที สนุกเหมือนเล่นเกม">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    /* Already signed in → straight to the app */
    try {
      if (Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); })) location.replace('./');
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="stylesheet" href="css/theme.css?v=20">
  <link rel="stylesheet" href="css/buttons.css?v=1">
  <link rel="stylesheet" href="css/desktop.css?v=2">
</head>
<body class="auth-body">
  <div class="lang-sw lang-fixed" role="group" aria-label="Language"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>

  <main class="auth">
    <section class="auth-hero">
      <img src="img/logo.png" onerror="this.onerror=null;this.src='icon.svg'" class="auth-logo" alt="Ohh-Exam">
      <h1>Ohh-Exam</h1>
      <p class="auth-tag">ฝึกข้อสอบวันละไม่กี่นาที สนุกเหมือนเล่นเกม</p>
      <ul class="auth-points">
        <li><span class="pt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg></span>บทเรียนสั้น ทำจบได้ในไม่กี่นาที</li>
        <li><span class="pt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.7 0 5.7 4 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg></span>มี XP ภารกิจ และ streak ให้อยากกลับมาทุกวัน</li>
        <li><span class="pt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>แบบทดสอบ 7 ชุด พร้อมเฉลยและคำอธิบาย</li>
      </ul>
    </section>

    <section class="auth-card">
      <div class="tabs" id="tabs" role="tablist">
        <button type="button" data-mode="in" class="on" role="tab">เข้าสู่ระบบ</button>
        <button type="button" data-mode="up" role="tab">สมัครสมาชิก</button>
      </div>

      <form id="f" class="form" novalidate>
        <label id="email-wrap" class="hidden">อีเมล (Email)
          <input type="email" id="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com">
        </label>
        <label><span id="user-label">ชื่อผู้ใช้หรืออีเมล</span>
          <input type="text" id="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="เช่น captain01">
          <span class="hint hidden" id="user-hint">ภาษาอังกฤษ ตัวเลข . _ - ได้ ยาว 3–20 ตัว</span>
        </label>
        <label>รหัสผ่าน (Password)
          <span class="pw">
            <input type="password" id="pw" autocomplete="current-password" placeholder="รหัสผ่านของคุณ">
            <button type="button" class="eye" id="eye">แสดง</button>
          </span>
        </label>
        <label id="pw2-wrap" class="hidden">ยืนยันรหัสผ่าน
          <input type="password" id="pw2" autocomplete="new-password" placeholder="พิมพ์รหัสผ่านอีกครั้ง">
        </label>
        <div class="form-msg" id="msg" role="status"></div>
        <button class="btn block" id="submit" type="submit">เข้าสู่ระบบ</button>
      </form>

      <div class="or"><span>หรือ</span></div>
      <button type="button" class="btn ghost block" id="guest">ลองใช้งานโดยไม่ต้องสมัคร</button>
      <p class="note center">ถ้าไม่เข้าสู่ระบบ ความคืบหน้าจะเก็บไว้ในเครื่องนี้เท่านั้น</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=8"></script>
  <script src="js/i18n.js?v=18"></script>
  <script src="js/login.js?v=11"></script>
</body>
</html>
