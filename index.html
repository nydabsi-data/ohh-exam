<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ohh-Exam</title>
  <meta name="description" content="ฝึกข้อสอบวันละไม่กี่นาที สนุกเหมือนเล่นเกม">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    /* Not signed in and not a guest → login page first */
    try {
      if (!Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); }) &&
          !localStorage.getItem('ohh_guest')) location.replace('login.html');
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=14">
  <link rel="stylesheet" href="css/theme.css?v=18">
  <link rel="stylesheet" href="css/buttons.css?v=1">
  <link rel="stylesheet" href="css/desktop.css?v=1">
</head>
<body>

  <!-- Home: exam hub (#exams) and learning path (#learn) -->
  <div id="home-view">
    <header class="topbar">
      <div class="topbar-in">
        <a class="top-back hidden" id="to-hub" href="#exams" aria-label="กลับไปเลือกข้อสอบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
        <a class="brand" href="#exams"><img src="img/logo.png" onerror="this.onerror=null;this.src='icon.svg'" alt=""><span>Ohh-Exam</span></a>
        <div class="lang-sw" role="group" aria-label="Language"><button type="button" data-lang="th">TH</button><button type="button" data-lang="en">EN</button></div>
        <button class="top-acct hidden" id="top-acct"></button>
      </div>
    </header>
    <main class="hub" id="hub">
      <div class="hub-head">
        <img class="hub-char" id="hub-char" alt="">
        <p class="hub-hello" id="hub-hello"></p>
        <h1 id="hub-title">เลือกโหมดที่จะฝึก</h1>
      </div>
      <div class="exam-grid" id="exam-grid"></div>
    </main>
    <main class="home hidden" id="learn">
      <div id="path"></div>
      <aside class="aside" id="aside"></aside>
    </main>
    <main class="page hidden" id="practice"><div id="practice-body"></div></main>
    <main class="page hidden" id="missions"><div id="mission-list" class="missions"></div></main>
    <main class="page hidden" id="stats"><div id="perf-body"></div></main>
    <main class="page hidden" id="profile"><div id="profile-body"></div></main>

    <!-- Bottom tab bar -->
    <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
      <a href="#exams" data-tab="home"><img src="img/tabs/home.png" alt=""><span>หน้าแรก</span></a>
      <a href="#missions" data-tab="missions"><img src="img/tabs/missions.png" alt=""><span>ภารกิจ</span><i class="tab-dot hidden" id="tab-dot"></i></a>
      <a href="#practice" data-tab="practice"><img src="img/tabs/practice.png" alt=""><span>ฝึกฝน</span><i class="tab-dot hidden" id="tab-dot-p"></i></a>
      <a href="#stats" data-tab="stats"><img src="img/tabs/stats.png" alt=""><span>ผลคะแนน</span></a>
      <a href="#profile" data-tab="profile"><img src="img/tabs/profile.png" alt=""><span>โปรไฟล์</span></a>
    </nav>
  </div>

  <!-- Lesson -->
  <div id="lesson-view" class="lesson hidden">
    <div class="l-top">
      <button class="x" id="quit" aria-label="ออกจากบทเรียน"></button>
      <div class="progress"><span id="prog"></span></div>
      <div class="l-timer hidden" id="l-timer" title="จับเวลา"><img src="img/clock.png" alt=""><span id="l-time">0:00</span></div>
    </div>
    <div class="l-body" id="qbox"></div>
    <footer class="foot" id="foot">
      <div class="foot-in">
        <div class="fb" id="fb"></div>
        <button class="btn" id="check" disabled>ตรวจคำตอบ</button>
      </div>
    </footer>
  </div>

  <!-- Result -->
  <div id="result-view" class="result hidden"></div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=8"></script>
  <script src="data/questions.js?v=9"></script>
  <script src="data/physics.js?v=1"></script>
  <script src="data/more.js?v=1"></script>
  <script src="js/i18n.js?v=17"></script>
  <script src="js/app.js?v=21"></script>
</body>
</html>
