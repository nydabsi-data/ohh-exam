<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ohh-Exam</title>
  <meta name="description" content="ฝึกข้อสอบวันละไม่กี่นาที สนุกเหมือนเล่นเกม">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    /* Not signed in and not a guest → login page first */
    try {
      if (!Object.keys(localStorage).some(function (k) { return /^sb-.+-auth-token$/.test(k); }) &&
          !localStorage.getItem('ohh_guest')) location.replace('login.html');
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <!-- Home: exam hub (#exams) and learning path (#learn) -->
  <div id="home-view">
    <header class="topbar">
      <div class="topbar-in">
        <a class="top-back hidden" id="to-hub" href="#exams" aria-label="กลับไปเลือกข้อสอบ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
        <a class="brand" href="#exams"><img src="img/logo.png" onerror="this.onerror=null;this.src='icon.svg'" alt=""><span>Ohh-Exam</span></a>
        <div class="stat streak" data-stat="streak"></div>
        <div class="stat xp" data-stat="xp"></div>
        <div class="stat hearts" data-stat="hearts"></div>
        <button class="top-acct hidden" id="top-acct"></button>
      </div>
    </header>
    <main class="hub" id="hub">
      <div class="hub-head">
        <p class="hub-hello" id="hub-hello"></p>
        <h1>เลือกข้อสอบที่จะฝึก</h1>
      </div>
      <div class="exam-grid" id="exam-grid"></div>
    </main>
    <main class="home hidden" id="learn">
      <div id="path"></div>
      <aside class="aside" id="aside"></aside>
    </main>
  </div>

  <!-- Lesson -->
  <div id="lesson-view" class="lesson hidden">
    <div class="l-top">
      <button class="x" id="quit" aria-label="ออกจากบทเรียน"></button>
      <div class="progress"><span id="prog"></span></div>
      <div class="stat hearts" data-stat="hearts"></div>
    </div>
    <div class="l-body" id="qbox"></div>
    <footer class="foot" id="foot">
      <div class="foot-in">
        <div class="fb" id="fb"></div>
        <button class="btn" id="check" disabled>ตรวจคำตอบ</button>
      </div>
    </footer>
  </div>

  <!-- Result -->
  <div id="result-view" class="result hidden"></div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="data/questions.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
